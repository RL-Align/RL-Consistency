[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-consistency"
version = "0.3.0.dev1"
description = "Independent shared execution and evidence for bitwise train-inference consistency"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = ["Development Status :: 2 - Pre-Alpha", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
runtime = ["transformers==5.20.1", "safetensors>=0.8,<0.9", "numpy>=1.26,<3"]

[project.scripts]
rl-consistency = "rl_consistency.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rl_consistency = ["recipes/*.json"]
